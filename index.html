<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anti.ly</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #00e5c8 0%, #6c6cff 50%, #8b2be2 100%);
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      gap: 1.5rem;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }

    .logo-img {
      width: 260px;
      max-width: 80vw;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      display: block;
    }

    .tagline {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.85);
    }

    .tagline a {
      color: #00e5c8;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      display: none;
    }

    .card.active { display: block; }

    .card h2 {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      background: linear-gradient(90deg, #00e5c8, #8b2be2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .field { margin-bottom: 1.2rem; }

    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #6c6cff;
      margin-bottom: 0.3rem;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: none;
      border-bottom: 2px solid #6c6cff;
      padding: 0.5rem 0;
      font-size: 1rem;
      font-family: 'Space Grotesk', sans-serif;
      outline: none;
      background: transparent;
      color: #222;
    }

    .field textarea {
      resize: vertical;
      min-height: 80px;
    }

    .field input:focus,
    .field textarea:focus {
      border-bottom-color: #8b2be2;
    }

    .btn {
      margin-top: 1rem;
      padding: 0.85rem 2.5rem;
      background: linear-gradient(90deg, #00e5c8, #8b2be2);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .success-msg {
      display: none;
      text-align: center;
      padding: 1.5rem;
      color: #333;
      font-size: 1rem;
      line-height: 1.8;
    }

    .check { font-size: 2.5rem; }
  </style>
</head>

  <div class="card" id="contactCard">
    <h2>Contact</h2>
    <form id="contactForm" onsubmit="submitForm(event)">
      <div class="field">
        <label>Your email</label>
        <input type="email" id="emailInput" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Domain</label>
        <input type="text" value="anti.ly" readonly>
      </div>
      <div class="field">
        <label>Message</label>
        <textarea id="msgInput" placeholder="Write your message here..."></textarea>
      </div>
      <button type="submit" class="btn">Submit</button>
    </form>
    <div class="success-msg" id="successMsg">
      <div class="check">✅</div>
      <strong>Message sent!</strong><br>We will be in touch soon.
    </div>
  </div>

  <script>
    function showForm() {
      var card = document.getElementById('contactCard');
      card.classList.add('active');
      card.scrollIntoView({ behavior: 'smooth' });
    }
    function submitForm(e) {
      e.preventDefault();
      var email = document.getElementById('emailInput').value;
      var msg = document.getElementById('msgInput').value;
      var subject = encodeURIComponent('Domain Inquiry: anti.ly');
      var body = encodeURIComponent('From: ' + email + '\nDomain: anti.ly\n\nMessage:\n' + msg);
      window.location.href = 'mailto:offcetech@gmail.com?subject=' + subject + '&body=' + body;
      document.getElementById('contactForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    }
  </script>
